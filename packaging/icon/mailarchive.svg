<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MailArchive's icon (design A, owner's pick 2026-11-04): a letter dropping into an
       open archive box on a teal rounded square. The macOS drawing: the square sits on
       Apple's 824-of-1024 grid with room for its shadow. Original geometric drawing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E8A8F"/>
      <stop offset="1" stop-color="#0D5560"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C985"/>
      <stop offset="1" stop-color="#DDAE65"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062E33" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <!-- inside of the open box -->
  <rect x="222" y="468" width="580" height="110" rx="26" fill="#7E5223"/>
  <!-- the letter, half way in -->
  <g transform="rotate(-7 512 400)" filter="url(#soft)">
    <rect x="322" y="214" width="380" height="270" rx="26" fill="#FFFDF7"/>
    <path d="M340 236 L512 368 L684 236" fill="none" stroke="#9FB4B8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- box front -->
  <rect x="202" y="526" width="620" height="312" rx="44" fill="url(#box)"/>
  <rect x="202" y="526" width="620" height="64" rx="32" fill="#F7DBA6"/>
  <rect x="432" y="660" width="160" height="48" rx="24" fill="#7E5223"/>
</svg>
