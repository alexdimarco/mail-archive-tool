<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- MailArchive's icon (design A), the 16 px drawing: every edge on a whole pixel. -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#147078" shape-rendering="geometricPrecision"/>
  <rect x="2" y="7" width="12" height="2" fill="#6A4419"/>
  <rect x="4" y="1" width="8" height="7" fill="#FFFDF7"/>
  <g fill="#6F8A90">
    <rect x="4" y="2" width="1" height="1"/><rect x="11" y="2" width="1" height="1"/>
    <rect x="5" y="3" width="1" height="1"/><rect x="10" y="3" width="1" height="1"/>
    <rect x="6" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/>
    <rect x="7" y="5" width="2" height="1"/>
  </g>
  <rect x="1" y="8" width="14" height="7" fill="#E7B86E"/>
  <rect x="1" y="8" width="14" height="1" fill="#F7DBA6"/>
  <rect x="6" y="11" width="4" height="1" fill="#6A4419"/>
</svg>
