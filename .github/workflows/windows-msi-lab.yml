name: windows-msi-lab

# Automates the part of the Windows lab a hosted runner CAN do without the
# hand-validation of README-RMM §D: build the release payload (§A, Linux), build
# the MSI from it (§B, WiX 3 on Windows), and install/uninstall it silently on real
# Windows (§C). ci.yml already builds+vets+tests the Go code on windows-latest; this
# adds the OS-level MSI + msiexec coverage that was hand-only.
#
# Scope today: the CURRENT mailarchive-desktop MSI. The single-executable release-N
# MSI (the pair, the N-1 to N upgrade, the new schedule kinds) is covered as SE1/SE2
# land and this workflow grows. Still hand-only (§D), never claimed here: Defender /
# SmartScreen behaviour, Restart Manager edge cases, and the schedule actually FIRING
# overnight.
on:
  workflow_dispatch: {}
  push:
    branches: [main, fix/review-2026-10]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/**'
      - '.github/workflows/windows-msi-lab.yml'

jobs:
  # §A — produce the MSI payload on Linux (no Windows needed), exactly as release.yml does.
  payload:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags + vcs.revision, so build-release.sh's stamp check passes
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build the release payload
        run: bash packaging/build-release.sh v0.0.0
      - name: Upload the MSI payload
        uses: actions/upload-artifact@v4
        with:
          name: msi-payload
          path: dist/mailarchive-desktop-windows-msi-payload.zip
          if-no-files-found: error

  # §B/§C — build the MSI from that payload and install/uninstall it on real Windows.
  msi:
    needs: payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the payload beside Build-MSI.ps1
        uses: actions/download-artifact@v4
        with:
          name: msi-payload
          path: packaging/mailarchive-desktop
      # Stage WiX 3.14 (candle/light) and put it on PATH for the next step. We do NOT
      # use `choco install wixtoolset`: choco edits the machine PATH, but a GitHub
      # Actions runner snapshots the environment at job start, so a later step's
      # `Get-Command candle.exe` still misses it (and choco's default package now
      # tracks WiX 4/5, which drop candle/light entirely). Writing the portable tools'
      # dir to $GITHUB_PATH is the one mechanism that DOES reach the next step.
      - name: Install WiX 3.14 build tools (portable; the runner image no longer ships them)
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'wix314'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip'
          # Force TLS 1.2 so the GitHub download works regardless of the image default.
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $tool -Force
          # Strip the Mark-of-the-Web from the downloaded tools. Without this, .NET can
          # refuse to load WixUtilExtension.dll from an Internet-zone file (HRESULT
          # 0x80131515), failing candle/light even though every file is present.
          Get-ChildItem -Path $tool -Recurse -File | Unblock-File
          if (-not (Test-Path (Join-Path $tool 'candle.exe')) -or -not (Test-Path (Join-Path $tool 'light.exe'))) {
            throw "WiX 3.14 download did not contain candle.exe/light.exe under $tool"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $tool
          Write-Host "WiX 3.14 staged at $tool and added to PATH for subsequent steps"
      - name: Build the MSI (WiX 3; Build-MSI.ps1 also fetches portable WiX if absent)
        working-directory: packaging/mailarchive-desktop
        shell: pwsh
        run: |
          # Capture every stream so that if candle/light fail we surface the real WiX
          # error as a GitHub ::error:: annotation (readable via the checks API without
          # repo auth), not just the generic "Process completed with exit code 1".
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'build-msi.log'
          try {
            .\Build-MSI.ps1 -Version 1.2.0 *>&1 | Tee-Object -FilePath $log
          } catch {
            ("EXCEPTION: " + $_.Exception.Message) | Tee-Object -FilePath $log -Append
          }
          if (Test-Path 'dist\MailArchiveDesktop.msi') {
            Write-Host 'MSI built OK.'
          } else {
            Write-Host '--- MSI not produced; tail of Build-MSI output follows ---'
            $lines = @(Get-Content $log -ErrorAction SilentlyContinue)
            $lines | Select-Object -Last 80
            foreach ($l in $lines) {
              if ($l -match 'CNDL\d|LGHT\d|\berror\b|Exception|could not|Unable to|failed with exit') {
                $m = ([string]$l).Replace('%','%25').Replace("`r",'').Replace("`n",' ')
                Write-Host "::error::$m"
              }
            }
            exit 1
          }
      - name: Install the MSI (silent, per-machine)
        shell: pwsh
        run: |
          $msi = Get-ChildItem packaging\mailarchive-desktop\dist\*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was produced" }
          "Installing $($msi.FullName)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if (Test-Path "$env:RUNNER_TEMP\install.log") { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "msiexec /i exited $($p.ExitCode)" }
      - name: Detect the install (the repo's own Detect-RMM.ps1), informational
        working-directory: packaging/mailarchive-desktop
        shell: pwsh
        continue-on-error: true
        run: |
          .\Detect-RMM.ps1
          "Detect-RMM.ps1 exit: $LASTEXITCODE"
      - name: Uninstall the MSI (silent)
        shell: pwsh
        run: |
          $msi = Get-ChildItem packaging\mailarchive-desktop\dist\*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
      - name: Upload the install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-install-log
          path: ${{ runner.temp }}/install.log
          if-no-files-found: ignore
