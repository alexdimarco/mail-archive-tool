name: ci

# Build, vet, and test on every push and PR to main, across all three OSes.
# Windows coverage is the point: it compiles the Outlook COM path (build-tagged,
# go-ole) and runs the non-COM tests natively. The COM export itself needs a real
# Outlook install and stays lab-tier (docs/scenario-catalog.md, MA-60) — CI never
# drives Outlook.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      # The go directive in go.mod is a MINIMUM, not a build pin: with
      # GOTOOLCHAIN=local, go-version-file would install exactly that patch
      # release (missing every later security fix). Track the current patch of
      # the supported line instead.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build (all packages)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 20 minutes per package, not go test's default 10: internal/app alone takes
      # about 6-7 minutes and came within 13 seconds of 10 under a full parallel run
      # (owner, 2026-10-26).
      - name: Test (incl. assurance gates)
        run: go test ./... -count=1 -timeout 20m

      # The unlock package's leases and locks decide when a master key is zeroed;
      # their tests are owed under the race detector (phase3 §3.2, MA-778; the P3-1a
      # adversarial pass, CRIT-01). The memory guard decides when a derivation and
      # the reader's unit reads may run (phase3 §3.7, MA-794).
      - name: Race detector (encrypted archives' keys)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./internal/keyring/ ./internal/vault/ ./internal/tty/ ./internal/memguard/ ./internal/server/

      # The Desktop keeps encrypted archives open in a long-running process: its
      # registry's unlock, lock, idle lock and Shut down are owed under the race
      # detector too (phase3 §3.2, K4; the P3-3 plan, 3c).
      - name: Race detector (the Desktop's open archives)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -run 'Encryption|Unlock|Remembered|Locks|Lock|OpenAnArchive|Records|RunNow|KeyRegistry|Hush|Switch|ForgetAll|RecoveryFile|Prepared|Cancel' ./internal/desktop/

      - name: Vulnerability scan (reachable code)
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The desktop binary links the OS folder picker (zenity) and, on Windows, its in-process
      # IFileOpenDialog: scan the Windows build of it as well (extraction design XC31, MA-529).
      # The tool is installed for the runner, then pointed at the Windows build with GOOS.
      - name: Vulnerability scan (the Windows desktop binary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./cmd/mailarchive-desktop
