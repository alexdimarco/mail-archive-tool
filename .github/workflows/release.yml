name: release

# On every version tag (v*), run the gates, build the full cross-platform
# binary matrix (incl. the macOS .app), and publish a GitHub Release with the
# artifacts attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, so build scripts can `git describe`

      # Build with the current patch of the supported Go line, never the
      # go.mod minimum (see ci.yml). `go version -m` on a shipped binary
      # names the toolchain that built it.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      # 20 minutes per package, as in ci.yml (internal/app's time under load).
      - name: Test (assurance gates must be green before shipping)
        run: go test ./... -timeout 20m

      - name: Vulnerability scan (a reachable known vulnerability blocks the release)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # A release is exactly vMAJOR.MINOR.PATCH: the release-stamp gate and the program
      # copies an encrypted archive keeps rely on it (program design §7).
      - name: Refuse a tag that is not an exact release
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not an exact release tag: ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build release artifacts
        run: bash packaging/build-release.sh "${GITHUB_REF_NAME}"

      - name: Compose release notes (changelog + install guide)
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's changed in ${GITHUB_REF_NAME}"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..${GITHUB_REF_NAME}"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "---"
            echo
            cat packaging/release-notes.md
          } > "${RUNNER_TEMP}/release-notes.md"

      # Published releases are unchangeable (owner ruling O7; program design §7): the
      # release is made as a draft with every asset; every uploaded file is downloaded
      # again, its SHA256SUMS compared with the build's and each asset checked against
      # it (the PG pass, NOTE-08), the asset list compared; and only then published. A
      # re-run against a release that exists fails — a fixed build ships as a new
      # version, never by replacing a published release's files.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
          check="${RUNNER_TEMP}/release-check"
          mkdir -p "$check"
          gh release download "${GITHUB_REF_NAME}" --dir "$check"
          cmp "$check/SHA256SUMS" dist/SHA256SUMS
          (cd "$check" && sha256sum -c SHA256SUMS)
          diff <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort) <(ls dist | sort)
          gh release edit "${GITHUB_REF_NAME}" --draft=false
